<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="start-screen">
      <h1>Super Tic Tac Toe</h1>
      <button class="btn btn--green btn--play" id="btn-play">Jugar</button>
    </section>

    <section id="game-screen" class="hidden">
      <p id="turn-indicator"></p>
      <div id="board">
        <div id="result-overlay" class="hidden">
          <p id="winner-text"></p>
          <div class="btn-row">
            <button class="btn btn--green" id="btn-new-game">Nuevo juego</button>
            <button class="btn btn--red" id="btn-exit">Volver al inicio</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="game.js"></script>
</body>
</html>
